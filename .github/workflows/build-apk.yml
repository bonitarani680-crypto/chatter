name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Prepare Android project
        shell: bash
        run: |
          # The ZIP contains a local.properties file with a developer's macOS paths.
          # Flutter will generate the correct file for the GitHub runner.
          rm -f android/local.properties
          flutter config --no-analytics
          flutter doctor -v

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chatter-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
